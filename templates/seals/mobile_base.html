{% load static %}
<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#103e2b">
  <meta name="referrer" content="same-origin">
  <title>{% block title %}Leitor de selos · Celular{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'css/mobile.css' %}">
</head>
<body>
  <header class="mobile-header"><a class="mobile-brand" href="{% url 'seals:mobile' %}"><span class="brand-mark">QR</span><span>Selos Veiculares<small>Consulta administrativa</small></span></a><form method="post" action="{% url 'accounts:logout' %}">{% csrf_token %}<button type="submit" class="logout">Sair</button></form></header>
  <main class="mobile-content">{% block content %}{% endblock %}</main>
  <nav class="mobile-nav" aria-label="Navegação móvel"><a href="{% url 'seals:mobile' %}">▣ &nbsp; Ler QR Code</a><a href="{% url 'accounts:dashboard' %}">⌂ &nbsp; Abrir portal</a></nav>
</body>
</html>
