<details class="quick-edit"><summary>Editar aqui</summary><form method="post" action="{% url 'people:quick' person.pk %}" class="stack-form">{% csrf_token %}<input type="hidden" name="version" value="{{ person.updated_at.isoformat }}"><input type="hidden" name="return" value="{{ request.get_full_path }}"><label>Cargo<input name="cargo" value="{{ person.cargo }}" maxlength="60"></label><label>Seção / setor<input name="secao" value="{{ person.secao }}" maxlength="120"></label><label>Telefone<input name="telefone" value="{{ person.telefone }}" maxlength="30"></label><label>Ramal<input name="ramal" value="{{ person.ramal }}" maxlength="30"></label><label>Identidade funcional<input name="identidade_funcional" value="{{ person.identidade_funcional }}" maxlength="30"></label><button type="submit" class="button primary small">Salvar nesta lista</button><a href="{% url 'people:edit' person.pk %}">Ficha de preenchimento</a></form></details>
